<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>AI Study Planner</title>
  <style>
    body { font-family: Arial; max-width: 820px; margin: auto; line-height: 1.4; }
    h2,h3 { margin-top: 20px; }
    input, button { margin: 6px 0; padding: 8px; width: 100%; }
    button { cursor: pointer; }
    pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    small { color: #666; }
  </style>
</head>
<body>

<h2>AI Study Planner</h2>
<small>Adaptive study planning that changes with your performance.</small>

<script>
if (!localStorage.getItem("user_id")) {
  localStorage.setItem("user_id", crypto.randomUUID());
}
const user_id = localStorage.getItem("user_id");
</script>

<h3>1) Generate Plan</h3>
<input id="exam" value="GATE DA">
<input id="date" value="2027-02-07">
<input id="hours" value="3">
<input id="level" value="beginner">
<button onclick="gen()">Generate Plan</button>
<pre id="out1"></pre>

<h3>2) Submit Today’s Feedback</h3>
<small>Be honest. The system adapts based on this.</small>
<input id="day" value="1">
<input id="acc" value="85">
<input id="time" value="120">
<button onclick="fb()">Submit Feedback</button>
<pre id="out2"></pre>

<h3>3) See Metrics (Proof)</h3>
<button onclick="mx()">View Metrics</button>
<pre id="out3"></pre>

<script>
const API = "https://ai-study-planner-backend-1-9ynd.onrender.com/";

async function gen() {
  const res = await fetch(API + "/planner/generate", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      user_id,
      exam_name: exam.value,
      exam_date: date.value,
      daily_hours: +hours.value,
      level: level.value
    })
  });
  out1.textContent = JSON.stringify(await res.json(), null, 2);
}

async function fb() {
  const res = await fetch(API + "/feedback/submit", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      user_id,
      day: +day.value,
      completed: true,
      accuracy: +acc.value,
      time_spent: +time.value
    })
  });
  out2.textContent = JSON.stringify(await res.json(), null, 2);
}

async function mx() {
  const res = await fetch(API + "/metrics/overview?user_id=" + user_id);
  out3.textContent = JSON.stringify(await res.json(), null, 2);
}
</script>

</body>
</html>
